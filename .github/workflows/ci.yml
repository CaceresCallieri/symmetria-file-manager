name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  electron:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 libgtk-3-0t64 libnss3 libasound2t64 \
            libgbm1 libdrm2 libxss1 libxtst6 libarchive-tools ripgrep python3
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        if: ${{ !cancelled() }}
        run: pnpm exec biome check . --reporter=summary
      - name: Check source policy
        if: ${{ !cancelled() }}
        run: pnpm exec oxlint --config anti-slop.config.mjs --disable-nested-config --format stylish -- .
      - name: Check types in each environment
        if: ${{ !cancelled() }}
        run: |
          result=0
          for project in \
            packages/fm-core packages/fm-main packages/fm-ui packages/fm-search \
            packages/fm-search/tsconfig.ui.json packages/fm-search/tsconfig.test.json \
            packages/fm-ui/tsconfig.test.json app/tsconfig.main.json app/tsconfig.renderer.json; do
            env GOMEMLIMIT=1536MiB timeout -k 30 900 \
              node_modules/.bin/tsc --checkers 1 -p "$project" --noEmit --pretty false || result=1
          done
          exit "$result"
      - name: Prepare the desktop contract for tests
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -s "$PWD/bin/symmetria-fm-electron" "$HOME/.local/bin/symmetria-fm-electron"
          printf 'XDG_RUNTIME_DIR=%s\n' "$(mktemp -d)" >> "$GITHUB_ENV"
      - name: Test packages and the Electron host
        if: ${{ !cancelled() }}
        run: pnpm -r --workspace-concurrency=1 test --maxWorkers=1
      - name: Check workspace dependencies
        if: ${{ !cancelled() }}
        run: pnpm exec knip --reporter json
      - name: Check dead code
        if: ${{ !cancelled() }}
        run: pnpm exec fallow dead-code --fail-on-issues
      - name: Check complexity
        if: ${{ !cancelled() }}
        run: pnpm exec fallow health --score --hotspots --fail-on-issues
      - name: Check duplication
        if: ${{ !cancelled() }}
        run: pnpm exec fallow dupes --fail-on-issues
      - name: Build the production bundle
        if: ${{ !cancelled() }}
        run: pnpm --filter @symmetria/fm-app build
